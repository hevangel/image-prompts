name: Encode GPT comparisons
on:
  push:
    branches: [gpt-image-encoding]
    paths:
      - 'samples/**'
      - 'runs/**'
      - 'scripts/encode_comparisons.py'
      - '.github/workflows/encode-comparisons.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gpt-image-encoding
  cancel-in-progress: false
jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow==13.0.0
      - run: python scripts/encode_comparisons.py
      - run: node scripts/validate_comparisons.cjs
      - run: node scripts/test_gallery.cjs
      - name: Commit compact comparison images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Encode GPT comparisons as WebP quality 95"
            git push
          fi
